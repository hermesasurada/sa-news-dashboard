<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SA Breaking News Dashboard</title>
<!-- 공통 Pretendard — app.css보다 먼저 링크해 병렬 로드.
     @import는 직렬이라 렌더가 한 왕복 늦어진다. -->
<link rel="stylesheet" href="/reader-fonts/core.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/hermes-ui.css">
<link rel="stylesheet" href="/static/hermes-theme.css">
<link rel="stylesheet" href="/static/model-selector.css">
<script src="/static/hermes-theme.js"></script>
<script>
// 요약 본문 명조 계열은 공통 로컬 자원에서 실제로 필요할 때만 주입한다.
// app.css에서 @import 하면 렌더 블로킹 + 직렬 로드라 기본 글꼴 사용자에게도
// 페이지 로드가 ~950ms 늘어난다(측정치). 여기서는 JS 주입이라 논블로킹.
//   - 저장된 글꼴이 명조 계열이면 시작 시 1회 주입
//   - 글꼴 선택 시트를 열 때도 주입(미리보기를 실제 글꼴로 보여주기 위해)
// 기본/시스템/조선일보명조는 추가 CSS 요청이 없다.
(function (w) {
  var NEEDS_WEB_FONT = { noto: 1, serif: 1, gowun: 1, nanum: 1, song: 1, mono: 1 };
  var HREF = '/reader-fonts/google.css';
  var injected = false;
  w.ensureReaderWebFonts = function () {
    if (injected) return;
    injected = true;
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = HREF;
    document.head.appendChild(link);
  };
  try {
    if (NEEDS_WEB_FONT[localStorage.getItem('saReaderFont')]) w.ensureReaderWebFonts();
  } catch (e) {}
})(window);
</script>
</head>
<body class="app-sa">

<div id="new-articles-banner" onclick="dismissBanner()"></div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<div class="header hermes-gnb">
  <div class="header-line">
    <div class="brand">
      <div class="logo" aria-hidden="true"><img src="/static/img/seekingalpha.png" alt="" width="40" height="40" decoding="async"></div>
      <h1>SA Breaking News<small>Seeking Alpha 속보 요약</small></h1>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-sort" id="font-btn" onclick="ensureReaderWebFonts();openFontPicker()" title="요약 본문 글꼴" aria-label="요약 본문 글꼴">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        <span class="btn-txt">글꼴</span>
      </button>
      <button type="button" class="btn-sort" id="model-btn" onclick="openModelConfig()" title="요약 모델·추론 설정" aria-label="요약 모델 설정">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="btn-trash-view" id="trash-view" onclick="toggleTrashView()" title="휴지통 (삭제된 기사)" aria-label="휴지통">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        <span class="btn-txt">휴지통</span>
      </button>
    </div>
  </div>
  <div class="search-bar">
    <input type="text" id="q" placeholder="검색어" title="제목·회사명·티커·요약에서 검색" />
    <button class="btn-search" onclick="search(0)">검색</button>
    <button class="btn-sort" id="sort-toggle" onclick="toggleSort()">
      <span id="sort-label">이메일시간순</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4m0 0L3 8m4-4l4 4"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4"/></svg>
    </button>
    <button class="btn-sort" id="order-toggle" onclick="toggleOrder()" title="정렬 방향">
      <svg class="ico-m ico-order" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
      <span id="order-label">최신순</span>
    </button>
    <button class="btn-reset" onclick="reset()" title="초기화" aria-label="초기화">
      <svg class="ico-m" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <span class="btn-txt">초기화</span>
    </button>
    <button class="btn-unread" id="unread-filter" onclick="toggleUnreadFilter()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="btn-txt">미읽음만</span>
    </button>
  </div>
</div>

<!-- 요약 모델 설정 — 화면은 공통 렌더러(model-selector.js, wm·yt와 같은 파일)가 그린다. 바꾸면 바로 저장. -->
<div id="model-modal" class="modal-overlay" onclick="if(event.target===this)closeModelConfig()">
  <div class="modal-box">
    <div class="modal-head">
      <h3>⚙️ 요약 모델 설정</h3>
      <button class="modal-close" onclick="closeModelConfig()" aria-label="닫기">✕</button>
    </div>
    <div class="mc-body"><div id="model-selector"></div></div>
  </div>
</div>

<!-- 요약 본문 글꼴 선택 모달 (모바일) -->
<div id="font-modal" class="modal-overlay" onclick="if(event.target===this)closeFontPicker()">
  <div class="modal-box">
    <div class="modal-head">
      <h3>🔤 요약 본문 글꼴</h3>
      <button class="modal-close" onclick="closeFontPicker()" aria-label="닫기">✕</button>
    </div>
    <div id="font-list" class="font-list"></div>
  </div>
</div>

<div class="stats" id="stats"></div>
<div class="container" id="cards"></div>
<div class="pagination" id="pagination"></div>

<script src="/static/model-selector.js"></script>
<script src="/static/app-utils.js"></script>
<script src="/static/app.js"></script>
<script>HermesTheme.mount(document.querySelector('.header-actions'), {className: 'btn-sort', before: document.getElementById('trash-view')});</script>
</body>
</html>
