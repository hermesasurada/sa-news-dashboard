<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SA News Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a1628;
    color: #c8d0dc;
    min-height: 100vh;
    padding: 16px 20px 40px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid #1a2a44;
  }
  .logo {
    font-size: 14px;
    font-weight: 700;
    color: #4a9eff;
  }
  .logo span { color: #fff; }
  .meta {
    font-size: 11px;
    color: #556677;
  }
  .meta span { color: #4a9eff; }
  .count {
    font-size: 11px;
    color: #667788;
    background: #111d30;
    padding: 3px 10px;
    border-radius: 10px;
  }
  .dashboard {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .card {
    background: #111d30;
    border: 1px solid #1a2a44;
    border-radius: 10px;
    padding: 14px 16px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: #2a4a6a; }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .card-ticker {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #4a9eff;
    background: #0f1a2e;
    padding: 2px 8px;
    border-radius: 4px;
    margin-right: 8px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    line-height: 1.4;
    flex: 1;
  }
  .card-time {
    font-size: 10px;
    color: #556677;
    white-space: nowrap;
    margin-left: 12px;
  }
  .card-summary {
    font-size: 12px;
    line-height: 1.6;
    color: #8899aa;
    margin-bottom: 10px;
  }
  .card-metrics {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .metric-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #0f1a2e;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
  }
  .metric-chip .sym { color: #667788; font-weight: 600; }
  .metric-chip .price { color: #fff; font-weight: 600; }
  .metric-chip .chg { font-weight: 600; }
  .metric-chip .chg.up { color: #4ade80; }
  .metric-chip .chg.down { color: #ff4d4d; }
  .footer {
    text-align: center;
    font-size: 10px;
    color: #334455;
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid #1a2a44;
  }
  .footer span { color: #4a9eff; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">SA <span>DASHBOARD</span></div>
  <div class="count">N articles</div>
  <div class="meta"><span>Asurada Portfolio</span> · YYYY-MM-DD</div>
</div>

<div class="dashboard">

  <!-- Card 1 -->
  <div class="card">
    <div class="card-header">
      <div>
        <span class="card-ticker">TICKER</span>
        <span class="card-title">Article headline goes here</span>
      </div>
      <div class="card-time">HH:MM AM/PM</div>
    </div>
    <div class="card-summary">
      Summary text in Korean. Keep it concise — 1-2 sentences max.
    </div>
    <div class="card-metrics">
      <div class="metric-chip">
        <span class="sym">TICKER</span>
        <span class="price">$0.00</span>
        <span class="chg down">-0.0%</span>
      </div>
    </div>
  </div>

  <!-- Add more cards as needed -->

</div>

<div class="footer">
  <span>Asurada Portfolio</span> · Generated by Hermes · Source: Seeking Alpha
</div>

</body>
</html>
